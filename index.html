<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робот Шульга - GitHub Pages Edition</title>
    <!-- Надійний CDN для стилів Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a4d5e;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 2px solid #374151;
            background: #f9fafb;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            width: min(90vw, 400px);
            height: min(90vw, 400px);
        }
        .cell {
            aspect-ratio: 1 / 1;
            position: relative;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .cell:hover {
            background-color: rgba(229, 231, 235, 0.7);
        }
        /* Стилі для червоних стін */
        .wall-v {
            position: absolute;
            top: 0;
            right: -2px;
            bottom: 0;
            width: 4px;
            background-color: #ef4444;
            z-index: 30;
        }
        .wall-h {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 4px;
            background-color: #ef4444;
            z-index: 30;
        }
        .robot {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 80%;
            height: 80%;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full flex flex-col items-center">
        <!-- Заголовок -->
        <h1 class="text-3xl font-light mb-2 tracking-wide text-center">Робот Шульга</h1>
        <p class="text-white/70 text-sm mb-6 text-center max-w-sm">
            Керуйте роботом, використовуючи лише дві команди: <strong>Вперед</strong> або <strong>Наліво та вперед</strong>. Дійдіть до зеленої клітинки <strong>G</strong>!
        </p>

        <!-- Ігрове поле -->
        <div id="grid-container" class="grid-container mb-6"></div>

        <!-- Панель керування -->
        <div class="w-full space-y-3 bg-white/10 p-5 rounded-2xl border border-white/10 shadow-lg">
            <div class="flex justify-between items-center">
                <span class="text-white/80 font-medium">Зроблено кроків:</span>
                <span id="steps-counter" class="text-2xl font-bold text-blue-300">0</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="resetGame()" class="py-3 px-4 rounded-xl font-medium bg-white/10 hover:bg-white/20 border border-white/20 transition-all">
                    Скинути
                </button>
                <button id="solve-btn" onclick="solve()" class="py-3 px-4 rounded-xl font-medium bg-blue-500/20 border border-blue-500/50 text-blue-300 hover:bg-blue-500/30 transition-all">
                    Розв'язати
                </button>
            </div>

            <!-- Повідомлення про статус гри -->
            <div id="success-alert" class="hidden p-4 rounded-xl bg-green-500/20 border border-green-500/50 text-green-300 text-center font-semibold animate-bounce mt-2">
                🎉 Перемога! Ціль досягнута!
            </div>
            <div id="failed-alert" class="hidden p-4 rounded-xl bg-red-500/20 border border-red-500/50 text-red-300 text-center font-semibold mt-2">
                💀 Гру закінчено! Спробуйте ще раз.
            </div>
        </div>
    </div>

    <script>
        // --- Константи гри ---
        const GRID_SIZE = 5;
        const START_POS = { x: 1, y: 4 };
        const TARGET_POS = { x: 3, y: 4 };
        const START_DIR = 'UP';
        const MAX_STEPS = 100;

        // Червоні стіни точно як на малюнку
        const WALLS = new Set([
            "1,0-2,0", // Вертикальна стіна вгорі
            "2,1-2,2", // Горизонтальна стіна
            "2,2-3,2", // Вертикальна стіна посередині
            "1,3-2,3", // Вертикальна стіна зліва знизу
            "2,4-3,4", // Вертикальна стіна біля G
            "4,3-4,4"  // Горизонтальна стіна справа знизу
        ]);

        const DIR_VECTORS = {
            UP: { x: 0, y: -1 },
            LEFT: { x: -1, y: 0 },
            DOWN: { x: 0, y: 1 },
            RIGHT: { x: 1, y: 0 }
        };

        const ROTATE_LEFT = {
            UP: 'LEFT',
            LEFT: 'DOWN',
            DOWN: 'RIGHT',
            RIGHT: 'UP'
        };

        // --- Стан гри ---
        let state = {
            pos: { ...START_POS },
            dir: START_DIR,
            path: [{ ...START_POS }],
            status: 'PLAYING',
            steps: 0
        };
        let isSolving = false;

        // --- Допоміжні функції ---
        function isWallBetween(p1, p2) {
            const key1 = `${p1.x},${p1.y}-${p2.x},${p2.y}`;
            const key2 = `${p2.x},${p2.y}-${p1.x},${p1.y}`;
            return WALLS.has(key1) || WALLS.has(key2);
        }

        function isOutOfBounds(p) {
            return p.x < 0 || p.x >= GRID_SIZE || p.y < 0 || p.y >= GRID_SIZE;
        }

        // --- Рендеринг інтерфейсу ---
        function render() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    // Підсвічування пройденого шляху
                    const isPath = state.path.some(p => p.x === x && p.y === y);
                    if (isPath) {
                        cell.classList.add('bg-blue-100/40');
                    }

                    // Ціль G
                    const isTarget = x === TARGET_POS.x && y === TARGET_POS.y;
                    if (isTarget) {
                        cell.classList.add('bg-green-100');
                        cell.innerHTML = '<span class="absolute inset-0 flex items-center justify-center text-green-600 font-bold text-xl">G</span>';
                    }

                    // Робот
                    const isRobot = state.pos.x === x && state.pos.y === y;
                    if (isRobot) {
                        const rotations = { UP: 0, LEFT: -90, DOWN: 180, RIGHT: 90 };
                        const robot = document.createElement('div');
                        robot.className = 'robot absolute inset-0 m-auto flex items-center justify-center';
                        robot.style.transform = `rotate(${rotations[state.dir]}deg)`;
                        robot.innerHTML = `
                            <div class="w-full h-full rounded-full border-2 border-blue-500 bg-blue-100 flex items-center justify-center shadow-md">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-pink-500">
                                    <path d="M12 5L19 18H5L12 5Z" fill="currentColor" />
                                </svg>
                            </div>
                        `;
                        cell.appendChild(robot);
                    }

                    // Відображення стін
                    if (isWallBetween({ x, y }, { x: x + 1, y })) {
                        const wall = document.createElement('div');
                        wall.className = 'wall-v';
                        cell.appendChild(wall);
                    }
                    if (isWallBetween({ x, y }, { x, y: y + 1 })) {
                        const wall = document.createElement('div');
                        wall.className = 'wall-h';
                        cell.appendChild(wall);
                    }

                    // Клік по клітинці
                    cell.addEventListener('click', () => handleCellClick(x, y));
                    container.appendChild(cell);
                }
            }

            // Оновлення лічильників та кнопок
            document.getElementById('steps-counter').innerText = state.steps;

            const solveBtn = document.getElementById('solve-btn');
            if (isSolving) {
                solveBtn.disabled = true;
                solveBtn.innerText = 'Аналіз...';
                solveBtn.className = 'py-3 px-4 rounded-xl font-medium bg-gray-500/20 border border-gray-500/30 text-gray-500 cursor-not-allowed';
            } else {
                solveBtn.disabled = false;
                solveBtn.innerText = 'Розв\'язати';
                solveBtn.className = 'py-3 px-4 rounded-xl font-medium bg-blue-500/20 border border-blue-500/50 text-blue-300 hover:bg-blue-500/30 transition-all';
            }

            // Алерт успіху
            const successAlert = document.getElementById('success-alert');
            if (state.status === 'SUCCESS') successAlert.classList.remove('hidden');
            else successAlert.classList.add('hidden');

            // Алерт програшу
            const failedAlert = document.getElementById('failed-alert');
            if (state.status === 'FAILED') failedAlert.classList.remove('hidden');
            else failedAlert.classList.add('hidden');
        }

        // --- Логіка ходів гравця ---
        function handleCellClick(tx, ty) {
            if (state.status !== 'PLAYING' || isSolving) return;

            const fv = DIR_VECTORS[state.dir];
            const fPos = { x: state.pos.x + fv.x, y: state.pos.y + fv.y };
            
            const ld = ROTATE_LEFT[state.dir];
            const lfv = DIR_VECTORS[ld];
            const lfPos = { x: state.pos.x + lfv.x, y: state.pos.y + lfv.y };

            let next = null;
            let nextD = state.dir;

            if (fPos.x === tx && fPos.y === ty && !isOutOfBounds(fPos) && !isWallBetween(state.pos, fPos)) {
                next = fPos;
            } else if (lfPos.x === tx && lfPos.y === ty && !isOutOfBounds(lfPos) && !isWallBetween(state.pos, lfPos)) {
                next = lfPos;
                nextD = ld;
            }

            if (next) {
                state.pos = next;
                state.dir = nextD;
                state.path.push({ ...next });
                state.steps += 1;

                if (next.x === TARGET_POS.x && next.y === TARGET_POS.y) {
                    state.status = 'SUCCESS';
                } else if (state.steps >= MAX_STEPS) {
                    state.status = 'FAILED';
                }
                render();
            }
        }

        // --- Скидання гри ---
        function resetGame() {
            state = {
                pos: { ...START_POS },
                dir: START_DIR,
                path: [{ ...START_POS }],
                status: 'PLAYING',
                steps: 0
            };
            isSolving = false;
            render();
        }

        // --- Пошук шляху BFS ---
        function findShortestPath(startPos, startDir) {
            const queue = [{
                pos: { ...startPos },
                dir: startDir,
                path: [],
                dirs: [],
                steps: 0
            }];
            const visited = new Set();
            visited.add(`${startPos.x},${startPos.y},${startDir}`);

            while (queue.length > 0) {
                const curr = queue.shift();

                if (curr.pos.x === TARGET_POS.x && curr.pos.y === TARGET_POS.y) {
                    return curr;
                }

                if (curr.steps >= MAX_STEPS) continue;

                // 1. Команда "Вперед"
                const fv = DIR_VECTORS[curr.dir];
                const fp = { x: curr.pos.x + fv.x, y: curr.pos.y + fv.y };
                if (!isOutOfBounds(fp) && !isWallBetween(curr.pos, fp)) {
                    const key = `${fp.x},${fp.y},${curr.dir}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            pos: fp,
                            dir: curr.dir,
                            path: [...curr.path, fp],
                            dirs: [...curr.dirs, curr.dir],
                            steps: curr.steps + 1
                        });
                    }
                }

                // 2. Команда "Наліво та вперед"
                const ld = ROTATE_LEFT[curr.dir];
                const lfv = DIR_VECTORS[ld];
                const lfp = { x: curr.pos.x + lfv.x, y: curr.pos.y + lfv.y };
                if (!isOutOfBounds(lfp) && !isWallBetween(curr.pos, lfp)) {
                    const key = `${lfp.x},${lfp.y},${ld}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            pos: lfp,
                            dir: ld,
                            path: [...curr.path, lfp],
                            dirs: [...curr.dirs, ld],
                            steps: curr.steps + 1
                        });
                    }
                }
            }
            return null;
        }

        // --- Автоматичне вирішення лабіринту ---
        async function solve() {
            if (isSolving) return;
            isSolving = true;
            render();

            let sPos = state.status !== 'PLAYING' ? START_POS : state.pos;
            let sDir = state.status !== 'PLAYING' ? START_DIR : state.dir;

            if (state.status !== 'PLAYING') {
                resetGame();
                isSolving = true;
                render();
            }

            const solution = findShortestPath(sPos, sDir);

            if (!solution) {
                alert("Шлях не знайдено з цієї позиції. Будь ласка, скиньте гру.");
                isSolving = false;
                render();
                return;
            }

            let currentPath = state.status !== 'PLAYING' ? [START_POS] : [...state.path];

            for (let i = 0; i < solution.path.length; i++) {
                await new Promise(r => setTimeout(r, 450)); // Швидкість анімації ходу
                const nextPos = solution.path[i];
                const nextDir = solution.dirs[i];
                currentPath.push({ ...nextPos });

                state.pos = nextPos;
                state.dir = nextDir;
                state.path = [...currentPath];
                state.steps += 1;

                if (nextPos.x === TARGET_POS.x && nextPos.y === TARGET_POS.y) {
                    state.status = 'SUCCESS';
                }
                render();
            }

            isSolving = false;
            render();
        }

        // Запуск гри при завантаженні
        render();
    </script>
</body>
</html>
