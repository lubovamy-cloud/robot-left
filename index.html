<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робот Шульга - Без стін</title>
    <!-- Tailwind CSS для стильного оформлення -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a4d5e;
        }
        .grid-cell {
            aspect-ratio: 1 / 1;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .robot-element {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Анімація появи */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s forwards;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between">

    <!-- Головний контейнер гри -->
    <div class="max-w-4xl mx-auto w-full px-4 py-6 flex-grow flex flex-col items-center justify-center">
        
        <!-- Заголовок та інструкція -->
        <header class="text-center mb-6 max-w-xl">
            <h1 class="text-3xl font-bold tracking-tight mb-2">🤖 Робот Шульга</h1>
            <p class="text-sm text-blue-200/80">
                Сцена без червоних стін. Проведіть робота до зеленіючої клітинки <strong class="text-green-300">G</strong>. 
                Пам'ятайте правила: тільки <span class="underline">Вперед</span> або <span class="underline">Наліво та вперед</span>!
            </p>
        </header>

        <!-- Ігрова зона -->
        <div class="w-full flex flex-col md:flex-row gap-6 items-center justify-center">
            
            <!-- Ігрове поле -->
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 shadow-2xl backdrop-blur-sm">
                <div id="grid" class="grid grid-cols-5 gap-1.5 bg-slate-900 p-2 rounded-xl border-2 border-slate-700/50" style="width: min(85vw, 380px); height: min(85vw, 380px);">
                    <!-- Клітинки будуть згенеровані через JS -->
                </div>
            </div>

            <!-- Панель керування -->
            <div class="flex flex-col gap-3 w-full md:w-64">
                
                <!-- Статистика -->
                <div class="bg-white/10 p-4 rounded-xl border border-white/10 flex justify-between items-center">
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-blue-300">Зроблено кроків</div>
                        <div id="steps-counter" class="text-3xl font-semibold">0</div>
                    </div>
                    <div id="direction-indicator" class="text-right">
                        <div class="text-[10px] uppercase tracking-wider text-blue-300">Напрямок</div>
                        <div id="dir-text" class="text-sm font-medium text-pink-400">Вгору ↑</div>
                    </div>
                </div>

                <!-- Кнопки дій -->
                <button id="btn-reset" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 py-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                    Скинути гру
                </button>

                <button id="btn-solve" class="w-full bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/40 text-blue-300 py-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l8.904-4.13c.437-.202.934-.202 1.37 0L21 21l-.813-5.096a1.999 1.999 0 011.03-2.1l4.896-2.27c.44-.2.44-.83 0-1.03l-4.896-2.27a2 2 0 01-1.03-2.1L21 3l-1.096 1.096a1.999 1.999 0 01-1.37 0L9 3l.813 5.096a2 2 0 01-1.03 2.1l-4.896 2.27c-.44.2-.44.83 0 1.03l4.896 2.27a1.999 1.999 0 011.03 2.1z"/></svg>
                    Показати розв'язок
                </button>

                <!-- Повідомлення про статус -->
                <div id="status-message" class="hidden text-center p-3 rounded-xl font-semibold"></div>
            </div>

        </div>
    </div>

    <!-- Підвал сайту -->
    <footer class="text-center py-4 text-xs text-white/40 border-t border-white/5">
        Розроблено спеціально для демонстрації роботи Робота Шульги.
    </footer>

    <!-- Скрипт логіки гри -->
    <script>
        // --- Налаштування ---
        const GRID_SIZE = 5;
        const START_POS = { x: 1, y: 4 };
        const TARGET_POS = { x: 3, y: 4 };
        const MAX_STEPS = 100;

        // Вектори руху відповідно до напрямку
        const DIR_VECTORS = {
            UP: { x: 0, y: -1 },
            LEFT: { x: -1, y: 0 },
            DOWN: { x: 0, y: 1 },
            RIGHT: { x: 1, y: 0 }
        };

        // Логіка повороту ліворуч (90 градусів проти годинникової)
        const ROTATE_LEFT = {
            UP: 'LEFT',
            LEFT: 'DOWN',
            DOWN: 'RIGHT',
            RIGHT: 'UP'
        };

        // Тексти напрямків для панелі
        const DIR_NAMES = {
            UP: 'Вгору ↑',
            LEFT: 'Ліворуч ➔',
            DOWN: 'Вниз ↓',
            RIGHT: 'Праворуч ➔'
        };

        // --- Стан гри ---
        let robotPos = { ...START_POS };
        let robotDir = 'UP';
        let steps = 0;
        let visitedPath = [{ ...START_POS }];
        let gameStatus = 'PLAYING'; // PLAYING, SUCCESS, FAILED
        let isSolving = false;

        // --- DOM елементи ---
        const gridElement = document.getElementById('grid');
        const stepsCounter = document.getElementById('steps-counter');
        const dirText = document.getElementById('dir-text');
        const btnReset = document.getElementById('btn-reset');
        const btnSolve = document.getElementById('btn-solve');
        const statusMessage = document.getElementById('status-message');

        // Ініціалізація ігрового поля
        function initGrid() {
            gridElement.innerHTML = '';
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell relative rounded-lg bg-slate-800/60 border border-slate-700/40 flex items-center justify-center cursor-pointer';
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    // Клік по клітинці для здійснення ходу
                    cell.addEventListener('click', () => handleCellClick(x, y));

                    // Ціль (клітинка G)
                    if (x === TARGET_POS.x && y === TARGET_POS.y) {
                        cell.classList.add('bg-green-500/20', 'border-green-500/40');
                        const targetText = document.createElement('div');
                        targetText.className = 'absolute font-bold text-green-400 text-xl pointer-events-none select-none';
                        targetText.textContent = 'G';
                        cell.appendChild(targetText);
                    }

                    gridElement.appendChild(cell);
                }
            }
            updateGridVisuals();
        }

        // Оновлення візуального стану поля
        function updateGridVisuals() {
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                const cx = parseInt(cell.dataset.x);
                const cy = parseInt(cell.dataset.y);

                // Очищення попереднього робота та підсвічування шляху
                const oldRobot = cell.querySelector('.robot-element');
                if (oldRobot) oldRobot.remove();

                cell.classList.remove('bg-blue-500/10', 'border-blue-500/20');

                // Перевірка чи була ця клітинка у пройденому шляху
                const isVisited = visitedPath.some(p => p.x === cx && p.y === cy);
                if (isVisited && !(cx === TARGET_POS.x && cy === TARGET_POS.y)) {
                    cell.classList.add('bg-blue-500/10', 'border-blue-500/20');
                }

                // Малювання робота в поточній позиції
                if (cx === robotPos.x && cy === robotPos.y) {
                    const robot = document.createElement('div');
                    robot.className = 'robot-element absolute w-4/5 h-4/5 rounded-full border-2 border-blue-400 bg-blue-100 flex items-center justify-center shadow-lg';
                    
                    // Кут повороту для стрілочки всередині робота
                    const rotations = { UP: 0, LEFT: -90, DOWN: 180, RIGHT: 90 };
                    const angle = rotations[robotDir];
                    
                    robot.style.transform = `scale(0.9) rotate(${angle}deg)`;
                    
                    // Стрілочка робота (рожевий трикутник)
                    robot.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 4L19 18H5L12 4Z" fill="#ec4899" />
                        </svg>
                    `;
                    cell.appendChild(robot);
                }
            });

            // Оновлення текстової статистики
            stepsCounter.textContent = steps;
            dirText.textContent = DIR_NAMES[robotDir];

            // Оновлення статусу гри
            if (gameStatus === 'SUCCESS') {
                statusMessage.className = 'text-center p-3 rounded-xl font-semibold bg-green-500/20 border border-green-500/40 text-green-300 pop-in';
                statusMessage.textContent = `Перемога за ${steps} кроків! 🎉`;
                statusMessage.classList.remove('hidden');
            } else if (gameStatus === 'FAILED') {
                statusMessage.className = 'text-center p-3 rounded-xl font-semibold bg-red-500/20 border border-red-500/40 text-red-300 pop-in';
                statusMessage.textContent = 'Вичерпано ліміт кроків! 😢';
                statusMessage.classList.remove('hidden');
            } else {
                statusMessage.classList.add('hidden');
            }
        }

        // Обробка логіки ходів користувача
        function handleCellClick(tx, ty) {
            if (gameStatus !== 'PLAYING' || isSolving) return;

            // Варіант 1: Прямо перед собою
            const vecForward = DIR_VECTORS[robotDir];
            const posForward = { x: robotPos.x + vecForward.x, y: robotPos.y + vecForward.y };

            // Варіант 2: Наліво та вперед
            const nextDir = ROTATE_LEFT[robotDir];
            const vecLeftForward = DIR_VECTORS[nextDir];
            const posLeftForward = { x: robotPos.x + vecLeftForward.x, y: robotPos.y + vecLeftForward.y };

            let moved = false;

            if (tx === posForward.x && ty === posForward.y) {
                // Рух вперед
                robotPos = posForward;
                moved = true;
            } else if (tx === posLeftForward.x && ty === posLeftForward.y) {
                // Поворот ліворуч та крок вперед
                robotPos = posLeftForward;
                robotDir = nextDir;
                moved = true;
            }

            if (moved) {
                steps++;
                visitedPath.push({ ...robotPos });

                if (robotPos.x === TARGET_POS.x && robotPos.y === TARGET_POS.y) {
                    gameStatus = 'SUCCESS';
                } else if (steps >= MAX_STEPS) {
                    gameStatus = 'FAILED';
                }
                updateGridVisuals();
            }
        }

        // Алгоритм пошуку найкоротшого шляху (BFS)
        function findShortestPath(startPos, startDir) {
            const queue = [{
                pos: { ...startPos },
                dir: startDir,
                path: [{ ...startPos }],
                dirs: [startDir]
            }];
            const visited = new Set();
            visited.add(`${startPos.x},${startPos.y},${startDir}`);

            while (queue.length > 0) {
                const curr = queue.shift();

                if (curr.pos.x === TARGET_POS.x && curr.pos.y === TARGET_POS.y) {
                    return curr;
                }

                if (curr.path.length > MAX_STEPS) continue;

                // Рух вперед
                const fVec = DIR_VECTORS[curr.dir];
                const fPos = { x: curr.pos.x + fVec.x, y: curr.pos.y + fVec.y };
                if (fPos.x >= 0 && fPos.x < GRID_SIZE && fPos.y >= 0 && fPos.y < GRID_SIZE) {
                    const key = `${fPos.x},${fPos.y},${curr.dir}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            pos: fPos,
                            dir: curr.dir,
                            path: [...curr.path, fPos],
                            dirs: [...curr.dirs, curr.dir]
                        });
                    }
                }

                // Рух ліворуч та вперед
                const lDir = ROTATE_LEFT[curr.dir];
                const lfVec = DIR_VECTORS[lDir];
                const lfPos = { x: curr.pos.x + lfVec.x, y: curr.pos.y + lfVec.y };
                if (lfPos.x >= 0 && lfPos.x < GRID_SIZE && lfPos.y >= 0 && lfPos.y < GRID_SIZE) {
                    const key = `${lfPos.x},${lfPos.y},${lDir}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            pos: lfPos,
                            dir: lDir,
                            path: [...curr.path, lfPos],
                            dirs: [...curr.dirs, lDir]
                        });
                    }
                }
            }
            return null;
        }

        // Кнопка анімаційного вирішення
        async function runAutoSolve() {
            if (isSolving) return;
            isSolving = true;
            btnSolve.disabled = true;
            btnSolve.textContent = 'Аналізую шлях...';

            resetGameLogic();

            const solution = findShortestPath(START_POS, START_DIR);

            if (!solution) {
                alert('Не вдалося прокласти оптимальний шлях!');
                isSolving = false;
                btnSolve.disabled = false;
                btnSolve.innerHTML = 'Показати розв\'язок';
                return;
            }

            // Покрокова анімація руху робота
            for (let i = 1; i < solution.path.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 350));
                robotPos = solution.path[i];
                robotDir = solution.dirs[i];
                steps = i;
                visitedPath.push({ ...robotPos });
                
                if (robotPos.x === TARGET_POS.x && robotPos.y === TARGET_POS.y) {
                    gameStatus = 'SUCCESS';
                }
                updateGridVisuals();
            }

            isSolving = false;
            btnSolve.disabled = false;
            btnSolve.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l8.904-4.13c.437-.202.934-.202 1.37 0L21 21l-.813-5.096a1.999 1.999 0 011.03-2.1l4.896-2.27c.44-.2.44-.83 0-1.03l-4.896-2.27a2 2 0 01-1.03-2.1L21 3l-1.096 1.096a1.999 1.999 0 01-1.37 0L9 3l.813 5.096a2 2 0 01-1.03 2.1l-4.896 2.27c-.44.2-.44.83 0 1.03l4.896 2.27a1.999 1.999 0 011.03 2.1z"/></svg>
                Показати розв'язок
            `;
        }

        // Скидання внутрішнього стану
        function resetGameLogic() {
            robotPos = { ...START_POS };
            robotDir = 'UP';
            steps = 0;
            visitedPath = [{ ...START_POS }];
            gameStatus = 'PLAYING';
        }

        // Обробник натискання "Скинути гру"
        btnReset.addEventListener('click', () => {
            if (isSolving) return;
            resetGameLogic();
            updateGridVisuals();
        });

        // Обробник натискання "Показати розв'язок"
        btnSolve.addEventListener('click', runAutoSolve);

        // Початковий запуск
        initGrid();
    </script>
</body>
</html>
